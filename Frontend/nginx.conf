server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}









# server { ... }

# A server block is one website’s set of rules. Everything inside the curly braces { } belongs to this one website.
# If missing: Nginx doesn’t know it is supposed to serve a website.

# server_name _;
# This is the website name Nginx answers to. The _ means “I don’t care what name was typed, answer anyway.”
#  It is a catch-all, handy when you visit using an IP address (like an EC2 address) instead of a domain name.

# root /usr/share/nginx/html;
# “My website files are in this folder.” This is the exact folder your Dockerfile copied the finished React files into:
# COPY --from=build /app/build /usr/share/nginx/html
# If they don’t match: Nginx looks in an empty folder and shows 404 errors.

# index index.html;
# “When someone visits the main address, show the file called index.html first.”
#  That is the single page that starts your whole React app.






