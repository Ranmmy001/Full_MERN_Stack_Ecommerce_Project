name: MERN Ecommerce AWS Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_api_url:
        description: "Public AWS API base URL, for example https://api.example.com"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, publish and update AWS Helm values
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.AWS_API_URL != '')

    env:
      AWS_API_URL: ${{ inputs.aws_api_url || vars.AWS_API_URL }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check AWS API URL
        run: |
          if [ -z "$AWS_API_URL" ]; then
            echo "AWS_API_URL is required before publishing production frontend images."
            exit 1
          fi

          case "$AWS_API_URL" in
            http://*|https://*) ;;
            *)
              echo "AWS_API_URL must begin with http:// or https://"
              exit 1
              ;;
          esac

      - name: Set lowercase GHCR owner
        id: owner
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "value=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-backend:latest

      - name: Build and publish Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ env.AWS_API_URL }}
            VITE_API_URL=${{ env.AWS_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-frontend:latest

      - name: Build and publish Admin
        uses: docker/build-push-action@v6
        with:
          context: ./Admin
          push: true
          build-args: |
            REACT_APP_API_URL=${{ env.AWS_API_URL }}
            VITE_API_URL=${{ env.AWS_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-admin:${{ env.IMAGE_TAG }}
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-admin:latest

      - name: Build and publish Audit Service
        uses: docker/build-push-action@v6
        with:
          context: ./Audit-Service
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-audit-service:${{ env.IMAGE_TAG }}
            ghcr.io/${{ steps.owner.outputs.value }}/mern-ecommerce-audit-service:latest

      - name: Update AWS Helm image tags
        run: python3 scripts/update-aws-image-tags.py "$IMAGE_TAG"

      - name: Commit updated AWS Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- helm/ecommerce-platform/values-aws.yaml; then
            echo "AWS Helm values are already up to date."
          else
            git add helm/ecommerce-platform/values-aws.yaml
            git commit -m "ci: update AWS image tags to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
