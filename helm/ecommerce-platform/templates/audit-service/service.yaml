apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.auditService.service.name }}
  namespace: {{ .Values.global.namespaces.audit }}
spec:
  type: {{ .Values.auditService.service.type }}
  selector:
    app: audit-service
  ports:
    - name: http
      port: {{ .Values.auditService.service.port }}
      targetPort: {{ .Values.auditService.service.targetPort }}
      protocol: TCP