apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-service-config
  namespace: {{ .Values.global.namespaces.audit }}
data:
  PORT: {{ .Values.auditService.config.PORT | quote }}
  DB_HOST: {{ .Values.auditService.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.auditService.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.auditService.config.DB_NAME | quote }}