apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.service.name }}
  namespace: {{ .Values.global.namespaces.mongodb }}
spec:
  clusterIP: None   ## This creates a headless Service, which is appropriate for discovering MongoDB StatefulSet pods through stable Kubernetes DNS names.
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.service.port }}
      targetPort: 27017
      protocol: TCP