apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: {{ .Values.global.namespaces.admin }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    app: admin
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.service.targetPort }}
      protocol: TCP
      {{- if and (eq .Values.admin.service.type "NodePort") .Values.admin.service.nodePort }}
      nodePort: {{ .Values.admin.service.nodePort }}
      {{- end }}